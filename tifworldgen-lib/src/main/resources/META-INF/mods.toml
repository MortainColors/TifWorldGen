modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All rights reserved"

[[mods]]
modId="tifworldgenlib"
version="${mod_version}"
displayName="TifWorldGenerationLibrary"
logoFile="logo.png"
authors="Modulak"
description='''
Backend library for TifWorldGen. It bundles the GDAL file-reading library so the main mod can open the local GeoTIFF map files that the player selects in the in-game config screen.

This library collects no data and performs no network communication - it only reads map files chosen by the player, fully offline.
'''

# Toto je kľúčové pre JarInJar:
[[dependencies.tifworldgenlib]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"