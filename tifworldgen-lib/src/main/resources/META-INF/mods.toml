[[mods]]
modId="tifworldgenlib"
version="${mod_version}"
displayName="TifWorldGenerationLibrary"
logoFile="logo.png"
authors="Modulak"
description='''
TifWorldGenerationLibrary is the core geospatial abstraction layer powering the TifWorldGen ecosystem. By integrating native GDAL (Geospatial Data Abstraction Library) pipelines, it enables high-performance parsing, scaling, and manipulation of custom GIS TIFF maps and multi-layered raster datasets.

As a dedicated backend framework, this mod mainly provides gdal library for correct Tif. file reading.
'''

