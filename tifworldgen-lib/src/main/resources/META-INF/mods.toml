modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All rights reserved"

[[mods]]
modId="tifworldgenlib"
version="${mod_version}"
displayName="TifWorldGenerationLibrary"
logoFile="logo.png"
authors="Modulak"
description='''
Backend library for TifWorldGen. Contains a built-in pure-Java GeoTIFF reader (classic TIFF and BigTIFF, stripped and tiled layouts, LZW/Deflate compression) that the main mod uses to open the local map files the player selects in the in-game config screen.

Fully offline: no telemetry, no analytics and no network communication of any kind - it only reads map files chosen by the player.
'''

# Toto je kľúčové pre JarInJar:
[[dependencies.tifworldgenlib]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"