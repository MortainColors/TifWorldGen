modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"

[[mods]]
modId="tifworldgen"
version="${mod_version}"
displayName="TifWorldGeneration"
logoFile="logo.png"
authors="Modulak"
credits="Massive thanks to the GDAL community for foundational geospatial libraries, to Distant Horizons for drastically elevating the player experience with long-range rendering, and to the creators of Serene Seasons, Snow! Real Magic!, and other ecosystem mods for enriching the overall gameplay immersion."
displayURL="https://github.com/MortainColors" # Tu môžeš neskôr hodiť reálny odkaz
#updateJSONURL="https://example.com/update.json"
description='''
TifWorldGen is an advanced world generation system designed to build high-fidelity Minecraft terrain directly from custom GIS TIFF maps. By seamlessly processing heightmaps, water levels, forest layers and more, it transforms raw data into organic landscapes.

Featuring a dynamic, altitude-based freeze line fully synchronized with Serene Seasons, optimized layer stacking via Snow! Real Magic!, and a built-in generation engine that directly injects Level-of-Detail (LOD) chunks into Distant Horizons, this mod delivers an unparalleled seasonal, climate-driven, and long-range visual simulation across a highly modular pipeline.
'''

[[dependencies.tifworldgen]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="tifworldgenlib"
mandatory=true
versionRange="[1.0.0-alpha,)"
ordering="BEFORE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="sereneseasons"
mandatory=true
versionRange="[9.1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="distanthorizons"
mandatory=false
versionRange="[2.4,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config = "tifworldgen.mixins.json"