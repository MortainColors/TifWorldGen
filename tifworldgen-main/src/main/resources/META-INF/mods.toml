modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"

[[mods]]
modId="tifworldgen"
version="${mod_version}"
displayName="TifWorldGeneration"
logoFile="logo.png"
authors="Modulak"
credits="Massive thanks to the GDAL community for their file-reading library, to Distant Horizons for drastically elevating the player experience with long-range rendering, and to the creators of Serene Seasons, Snow! Real Magic!, and other ecosystem mods for enriching the overall gameplay immersion."
displayURL="https://github.com/MortainColors" # Tu môžeš neskôr hodiť reálny odkaz
#updateJSONURL="https://example.com/update.json"
description='''
TifWorldGen builds high-fidelity Minecraft terrain from local GeoTIFF map files that the player selects in the in-game config screen - heightmaps, water masks and forest maps of any real-world region.

It works fully offline: no telemetry, no analytics and no network communication of any kind. The mod only reads the map files chosen by the player - nothing is collected and nothing leaves the player's computer.

Featuring a dynamic, altitude-based freeze line synchronized with Serene Seasons, optimized layer stacking via Snow! Real Magic!, and a built-in engine that injects Level-of-Detail (LOD) chunks into Distant Horizons.
'''

[[dependencies.tifworldgen]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="tifworldgenlib"
mandatory=true
versionRange="[1.0.0-alpha,)"
ordering="BEFORE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="sereneseasons"
mandatory=true
versionRange="[9.1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.tifworldgen]]
modId="distanthorizons"
mandatory=false
versionRange="[2.4,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config = "tifworldgen.mixins.json"